 A ratio experiment based on Dioptra 34, not a reconstruction of an excavated instrument. Wheel rolling, transmission and pointer interpolation are idealized. The trial changes an observed ratio; it does not explain the cause of that ratio. Only the first worm is tested. The second remains at its assumed 30:1 ratio.</metadata><style>.ct-svg {
